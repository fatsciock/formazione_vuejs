<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>DOM + Eventi</title>
</head>
<body>
  <h1>Interazioni</h1>

  <h2>Contatore</h2>
  <button id="meno">-</button>
  <span id="contatore">0</span>
  <button id="piu">+</button>

  <h2>To-do List</h2>
  <input type="text" id="todoInput" placeholder="Nuovo task">
  <button id="aggiungiTodo">Aggiungi</button>
  <ul id="todoLista"></ul>

  <h2>Password</h2>
  <input type="password" id="password">
  <label><input type="checkbox" id="togglePwd"> Mostra password</label>

  <script src="04-interazione.js"></script>
</body>
</html>
