<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body id="app">
        <input v-model="text" placeholder="Inserisci testo">
        <p>Il testo inserito è {{ text }}</p>
    </body>

    <!-- Vue.js -->
    <script>
        const { createApp, ref } = Vue

        createApp({
            setup() {
                const text = ref('')

                return {
                    text,
                }
            }
        }).mount('#app')
    </script>
</html>
