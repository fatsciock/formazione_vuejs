<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body id="app">
        <button @click="toggle">Cambia</button>
        <div v-if="awesome">
            <p>Vue.js è bellissimo!</p>
            <input></input>
        </div>
        <p v-else>E invece no! 😢</p>
    </body>

    <!-- Vue.js -->
    <script>
        const { createApp, ref } = Vue

        createApp({
            setup() {
                const awesome = ref(true)

                function toggle() {
                    awesome.value = !awesome.value
                }

                return {
                    awesome,
                    toggle
                }
            }
        }).mount('#app')
    </script>
</html>
