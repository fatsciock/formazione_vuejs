<!DOCTYPE html>
<html>
  <head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Es 2</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="#">
  </head>
  <body id="app">
    <navbar></navbar>
    <cardlist :cards="cardsData"></cardlist>
  </body>

  <script type="module">
    const { createApp, ref } = Vue
    import Cardlist from './cardlist.js';
    import Navbar from './navbar.js';

    createApp({
      components: {
        Navbar,
        Cardlist
      },
      setup() {
        let id = 0;
        const cardsData = ref([
          { id:id++, title: 'Card 1', content: 'This is card 1' },
          { id:id++, title: 'Card 2', content: 'This is card 2' },
          { id:id++, title: 'Card 3', content: 'This is card 3' },
          { id:id++, title: 'Card 4', content: 'This is card 4' },
          { id:id++, title: 'Card 5', content: 'This is card 5' },
          { id:id++, title: 'Card 6', content: 'This is card 6' },
          { id:id++, title: 'Card 7', content: 'This is card 7' },
          { id:id++, title: 'Card 8', content: 'This is card 8' },
          { id:id++, title: 'Card 9', content: 'This is card 9' },
          { id:id++, title: 'Card 10', content: 'This is card 10' },
        ])
        
        return {
          cardsData
        }
      }
    }).mount('#app')
  </script>
</html>
